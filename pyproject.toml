[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fnmedia-ext"
# 单一来源：版本号只写在 VERSION 文件，pyproject 动态读取（2026-11-13 去重）
dynamic = ["version"]
description = "飞牛影视（fnOS trim.media）在线资源扩展：可逆接管插件"
requires-python = ">=3.11"
dependencies = [
    "fastapi==0.162.2",
    "uvicorn==0.54.0",
    "httpx==0.28.1",
    "wasmtime==49.0.0",
]

[tool.setuptools.dynamic]
version = {file = ["VERSION"]}

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["proxy"]

[tool.setuptools]
py-modules = []
